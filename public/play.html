<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <div class="player" id="player">
    <div class="player-bar">
      <a class="btn sm" id="back" href="/" aria-label="Back to the library"></a>
      <div class="grow" style="min-width:0">
        <div class="t" id="title">Loading...</div>
        <div class="crumb" id="crumb"></div>
      </div>
      <button class="btn sm icon" id="reload" title="Restart" hidden></button>
      <button class="icon-btn theme-toggle" id="theme" type="button"></button>
      <button class="btn sm icon" id="full" title="Full screen"></button>
    </div>
    <div class="stage" id="stage">
      <div class="loading" id="loading" style="inset:0">Loading...</div>
    </div>
  </div>
  <script src="/assets/common.js"></script>
  <script src="/assets/play.js"></script>
</body>
</html>
