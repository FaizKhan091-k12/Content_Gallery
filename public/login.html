<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <img class="logo" src="/assets/favicon.svg" alt="">
      <div>
        <h1 id="site-name">Game Portal</h1>
        <p class="muted" id="tagline" style="margin:6px 0 0">Sign in to play</p>
      </div>
      <form id="login" autocomplete="on">
        <label class="field">Email or username<input class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="field">Password<input class="input" name="password" type="password" autocomplete="current-password" required></label>
        <div class="alert error" id="error" hidden></div>
        <button class="btn primary" type="submit" style="height:46px">Sign in</button>
      </form>
      <p class="small faint" style="margin:0">Access is by invitation. Ask the admin if you need an account or forgot your password.</p>
    </div>
  </main>
  <script src="/assets/common.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
