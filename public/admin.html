<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brandmark" href="/"><img src="/assets/favicon.svg" alt=""><span id="site-name">Game Portal</span></a>
    <span class="badge brand">Admin</span>
    <div class="grow"></div>
    <a class="btn sm" href="/">Open the library</a>
    <button class="icon-btn theme-toggle" id="theme" type="button"></button>
    <div id="user"></div>
  </header>
  <main class="main" style="max-width:1280px;margin:0 auto">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="content">Content</button>
      <button class="tab" data-tab="people">People</button>
      <button class="tab" data-tab="activity">Activity</button>
      <button class="tab" data-tab="books">Curriculum</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <section id="tab-content"></section>
    <section id="tab-people" hidden></section>
    <section id="tab-activity" hidden></section>
    <section id="tab-books" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
  <script src="/assets/common.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
